[package]
name = "lanshare"
version = "0.3.0"
description = "LAN-only messaging and file sharing between your phone and computer"
authors = ["defyan94"]
edition = "2024"
default-run = "lanshare"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "lanshare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
# Already in Cargo.lock (through Tauri); local time for picture names.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dunce = "1.0.5"
futures-util = "0.3.34"
gethostname = "1.1.0"
getrandom = "0.4.3"
hex = "0.4.3"
hyper-util = { version = "0.1.21", features = ["tokio"] }
if-addrs = "0.15.0"
mime_guess = "2.0.5"
notify = "8.2.0"
percent-encoding = "2.3.2"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rcgen = { version = "0.14.10", features = ["x509-parser", "pem"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.13.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.6.0"
tauri-plugin-opener = "2.7.1"
tauri-plugin-single-instance = "2.5.3"
time = "0.3.55"
tokio = { version = "1.53.3", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trash = "5.2.9"
x509-parser = { version = "0.18.1", features = ["verify"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
# Paused time for tests of idle limits.
tokio = { version = "1.53.3", features = ["test-util"] }

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[target."cfg(target_os = \"macos\")".dependencies]
# All already in Cargo.lock through tao/wry: launch at login (SMAppService),
# notifications with buttons (UNUserNotificationCenter), the pasteboard and
# the Dock badge.
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSImageRep", "NSBitmapImageRep"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = [
    "std",
    "bitflags",
    "block2",
    "UNError",
    "UNNotification",
    "UNNotificationAction",
    "UNNotificationCategory",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSettings",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

[target."cfg(windows)".dependencies]
# The clipboard on Windows (macOS reads the pasteboard natively).
arboard = "3.7.0"
png = "0.18.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Power", "Win32_System_Registry"] }

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runners bill at a much higher rate, so they only run for PRs.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["windows-latest","macos-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      # The runner context is not available at job level; derive it from the matrix.
      PYTHON: ${{ startsWith(matrix.os, 'windows') && 'python' || 'python3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # tsc + vite: dist/ is embedded by the Rust server.
      - run: npm run build
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
      - name: End-to-end API smoke test
        shell: bash
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --example headless
          mkdir -p .dev-data
          ./src-tauri/target/debug/examples/headless --data .dev-data/ci --shared .dev-data/ci-share --local-port 53299 > .dev-data/headless.log 2>&1 &
          for i in $(seq 1 60); do grep -q "Press Ctrl" .dev-data/headless.log && break; sleep 1; done
          sed 's/token=[A-Za-z0-9_-]*/token=***/' .dev-data/headless.log
          PORT=$(grep -o 'listening on port [0-9]*' .dev-data/headless.log | head -1 | grep -o '[0-9]*$')
          PHONE_OVERRIDE="https://127.0.0.1:${PORT:-39210}" bash scripts/api_smoke.sh .

  windows-installer:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release
      - run: npm ci
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: LanShare-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

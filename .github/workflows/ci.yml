name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs these same jobs for a tag and publishes this run's installer.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runners bill at a much higher rate, so they only run for PRs and releases.
        os: ${{ fromJSON((github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')) && '["windows-latest","macos-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      # The runner context is not available at job level; derive it from the matrix.
      PYTHON: ${{ startsWith(matrix.os, 'windows') && 'python' || 'python3' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # A cache saved for a tag can only be restored by that tag, so it would never be used.
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - run: npm ci
      # tsc + vite: dist/ is embedded by the Rust server.
      - run: npm run build
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
      - name: End-to-end API smoke test
        shell: bash
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --example headless
          mkdir -p .dev-data
          ./src-tauri/target/debug/examples/headless --data .dev-data/ci --shared .dev-data/ci-share --local-port 53299 > .dev-data/headless.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do grep -q "Press Ctrl" .dev-data/headless.log && break; sleep 1; done
          sed 's/token=[A-Za-z0-9_-]*/token=***/' .dev-data/headless.log
          PORT=$(grep -o 'listening on port [0-9]*' .dev-data/headless.log | head -1 | grep -o '[0-9]*$')
          PHONE_OVERRIDE="https://127.0.0.1:${PORT:-39210}" bash scripts/api_smoke.sh .

  windows-installer:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - run: npm ci
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v7
        with:
          name: LanShare-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  windows-install-check:
    name: Windows install check
    needs: windows-installer
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: LanShare-windows-x64
          path: installer
      - name: Install silently, check the firewall rule, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Exactly one installer, so the file checked here is the one a release publishes.
          $setups = @(Get-ChildItem installer -Filter *-setup.exe)
          if ($setups.Count -ne 1) { throw "expected one installer in the artifact, found $($setups.Count)" }
          $setup = $setups[0]
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'

          $rule = Get-NetFirewallRule -DisplayName 'LanShare' -ErrorAction SilentlyContinue
          if (-not $rule) { throw 'the installer did not add the firewall rule' }
          $app = ($rule | Get-NetFirewallApplicationFilter).Program
          $remote = ($rule | Get-NetFirewallAddressFilter).RemoteAddress
          $protocol = ($rule | Get-NetFirewallPortFilter).Protocol
          "rule: enabled=$($rule.Enabled) direction=$($rule.Direction) action=$($rule.Action) profile=$($rule.Profile) remote=$remote protocol=$protocol program=$app"
          if ("$($rule.Enabled)" -ne 'True' -or "$($rule.Direction)" -ne 'Inbound' -or "$($rule.Action)" -ne 'Allow') { throw 'the rule is not an enabled inbound allow rule' }
          if ("$($rule.Profile)" -ne 'Private') { throw "the rule applies to '$($rule.Profile)', expected Private only" }
          if ("$remote" -ne 'LocalSubnet') { throw "the rule allows '$remote', expected LocalSubnet" }
          if ("$protocol" -ne 'TCP') { throw "the rule protocol is '$protocol', expected TCP" }
          if (-not $app.StartsWith("$env:ProgramFiles\", [StringComparison]::OrdinalIgnoreCase) -or -not (Test-Path $app)) { throw "the rule's program '$app' is not an installed exe under Program Files" }
          $installDir = Split-Path $app

          # A hosted runner may not let a GUI app start, so a silent server is only a warning.
          Start-Process -FilePath $app
          $up = $false
          for ($i = 0; $i -lt 60 -and -not $up; $i++) {
            Start-Sleep -Seconds 1
            & curl.exe -sk --max-time 2 -o NUL https://127.0.0.1:39210/api/ca
            $up = ($LASTEXITCODE -eq 0)
          }
          if ($up) { 'the installed app answers on port 39210' } else { '::warning::the installed app did not answer on port 39210' }
          Stop-Process -Name ([IO.Path]::GetFileNameWithoutExtension($app)) -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          # With _?= the uninstaller runs in place instead of relaunching from %TEMP%, so -Wait really waits.
          Start-Process -Wait -FilePath (Join-Path $installDir 'uninstall.exe') -ArgumentList '/S', "_?=$installDir"
          if (Get-NetFirewallRule -DisplayName 'LanShare' -ErrorAction SilentlyContinue) { throw 'the uninstaller left the firewall rule behind' }
          if (Test-Path $app) { throw 'the uninstaller left the app behind' }
          'install and uninstall checks passed'
          # A failed curl probe above leaves a non-zero exit code behind; every real failure has thrown already.
          exit 0
